name: Natural Commit Activity

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # ✅ allows push access

      - name: Randomize whether today's run has activity
        id: activity
        shell: bash
        run: |
          # Manual runs are always honored. Scheduled runs commit on about 45% of days.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( RANDOM % 100 < 45 )); then
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
            echo "Today's run will create activity."
          else
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
            echo "No activity scheduled for today."
          fi

      - name: Add a natural time variation
        if: steps.activity.outputs.should_commit == 'true' && github.event_name == 'schedule'
        shell: bash
        run: sleep $((RANDOM % 1801))

      - name: Commit step - 22f3001001@ds.study.iitm.ac.in
        if: steps.activity.outputs.should_commit == 'true'
        run: |
          echo "TDSFU Daily run: $(date -u) TDSFU" >> daily-log.txt

      - name: Git Commit and Push
        if: steps.activity.outputs.should_commit == 'true'
        run: |
          git config user.name "Aditya" # Replace with your GitHub username if preferred
          git config user.email "22f3001001@ds.study.iitm.ac.in" # Ensure this matches your GitHub email
          git add daily-log.txt
          git commit -m "Auto commit at $(date -u)" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase origin main
            git push && break
            echo "Push failed, retrying ($i/3)..."
            sleep 5
          done
